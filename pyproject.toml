[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-resonance"
version = "0.1.0"
description = "Research project for multi-frequency neural Treasury yield-curve forecasting."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
download-treasury-data = "market_resonance.data.download_treasury:main"
explore-treasury-data = "market_resonance.visualization.explore_treasury:main"
evaluate-baselines = "market_resonance.evaluation.run_baselines:main"
train-first-lstm = "market_resonance.training.train_lstm:main"
run-lstm-inference = "market_resonance.inference.run_inference:main"
run-ablation-study = "market_resonance.evaluation.run_ablation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
